name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - master

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: checkout source code
        usage: actions/checkout@4

      - name: Print current date
        run: date

      - name: Display files
        run: ls -la
      
      - name: Completion message
        run: ls -lrth