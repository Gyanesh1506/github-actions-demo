
name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - master

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Print current date
        run: date

      - name: Display files
        run: ls -la

      - name: Display files with details
        run: ls -lrth