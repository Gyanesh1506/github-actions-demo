
name: Enterprise App CI Pipeline

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise_db
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d enterprise_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout application source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: Gyanesh1506/enterprise-app
          path: enterprise-app

      # Step 2: Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Build application using Maven
      - name: Build application
        working-directory: ./enterprise-app
        env:
          DB_URL: jdbc:postgresql://localhost:5432/enterprise_db
          DB_USERNAME: appuser
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean package

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./enterprise-app
          push: true
          tags: gyan1506/enterprise-app:latest
