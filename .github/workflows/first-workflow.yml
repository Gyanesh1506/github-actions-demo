name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - master

jobs:
  first-job:
    runs-on: ubuntu-latest
      services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise_db
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout enterprise-app repository
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: Gyanesh1506/enterprise-app
          path: enterprise-app

      # Step 2: Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Step 3: Check Java version
      - name: Check Java version
        run: java -version

      # Step 4: Check Maven version
      - name: Check Maven version
        run: mvn -version

      # Step 5: Display current directory
      - name: Display current directory
        run: pwd

      # Step 6: Display workspace files
      - name: Display workspace files
        run: ls -la

      # Step 7: Display application files
      - name: Display application files
        run: ls -la ./enterprise-app

      # Step 8: Locate pom.xml
      - name: Find Maven project
        run: find ./enterprise-app -name pom.xml -print

      # Step 9: Completion message
      - name: Completion message
        run: echo "Repository inspection completed successfully!"

      # Step 10: building maven pkg
      - name: Building maven pkg
        working-directory: ./enterprise-app
        run: mvn clean package
