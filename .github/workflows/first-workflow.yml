
name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - master

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Step 3: Check Java version
      - name: Check Java version
        run: java -version

      # Step 4: Check Maven version
      - name: Check Maven version
        run: mvn -version

      # Step 5: Display current directory
      - name: Display current directory
        run: pwd

      # Step 6: Display repository files
      - name: Display repository files
        run: ls -la

      # Step 7: Locate pom.xml
      - name: Find Maven project
        run: find . -name pom.xml

      # Step 8: Display files with details
      - name: Display files with details
        run: ls -lrth

      # Step 9: Completion message
      - name: Completion message
        run: echo "Repository inspection completed successfully!"

      # Step 10: finding path of pom.xml
      - name: Finding path of pom.xml
        run: find / -name pom.xml
