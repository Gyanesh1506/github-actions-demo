name: My First GitHub Actions Workflow

on:
  push:
    branches:
      - master

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Step 3: Print current date
      - name: Print current date
        run: date

      # Step 4: Display files
      - name: Display files
        run: ls -la

      # Step 5: Display files with details
      - name: Display files with details
        run: ls -lrth

      # Step 6: Verify Java installation
      - name: Check Java version
        run: java -version

      # Step 7: Completion message
      - name: Completion message
        run: echo "GitHub Actions workflow completed successfully!"
      
      # step 8 : checking maven version
      - name: checking maven version
        run: mvn -version
      
      # step 9 : Build application
      - name: Building application
        run:  mvn clean package